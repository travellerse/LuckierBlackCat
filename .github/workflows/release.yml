---
name: Release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 2.0.0
      prerelease:
        description: Publish as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use semantic version format: $version"
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Verify repository version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $package = Get-Content package.xml -Raw
          $expectedVersion = [regex]::Escape($version)
          $versionPattern = "<version>0\.23\.325-$expectedVersion</version>"
          if ($package -notmatch $versionPattern) {
            throw "package.xml is incompatible with mod $version."
          }

      - name: Restore
        run: dotnet restore LuckierBlackCat.sln

      - name: Build
        run: >-
          dotnet build LuckierBlackCat.sln
          --configuration Release
          --no-restore

      - name: Test
        run: dotnet test LuckierBlackCat.sln --configuration Release --no-build

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $packageName = "LuckierBlackCat-v$version"
          $packageDirectory = Join-Path release $packageName
          New-Item -ItemType Directory -Path $packageDirectory -Force |
            Out-Null

          $files = @(
            "bin/Release/LuckierBlackCat.dll",
            "bin/Release/LuckierBlackCat.Core.dll",
            "bin/Release/LuckierBlackCat.Patching.dll",
            "package.xml",
            "preview.jpg",
            "LICENSE.txt",
            "README.md",
            "README_EN.md",
            "README_JP.md"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Required package file is missing: $file"
            }
            Copy-Item $file $packageDirectory
          }

          $archive = "release/$packageName.zip"
          Compress-Archive -Path "$packageDirectory/*" -DestinationPath $archive
          "name=$packageName" >> $env:GITHUB_OUTPUT
          "path=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LuckierBlackCat v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.path }}
          prerelease: ${{ inputs.prerelease || false }}
