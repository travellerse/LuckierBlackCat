---
name: CI

"on":
  push:
    branches: [dev, master, "refactor/**"]
  pull_request:
    branches: [dev, master]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  workflow-lint:
    name: Validate workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: python -m pip install yamllint==1.38.0

      - name: Validate workflow YAML
        run: yamllint .github/workflows/ci.yml .github/workflows/release.yml

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LuckierBlackCat.sln

      - name: Build
        run: >-
          dotnet build LuckierBlackCat.sln
          --configuration Release
          --no-restore

      - name: Test
        run: dotnet test LuckierBlackCat.sln --configuration Release --no-build

      - name: Upload release artifact
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LuckierBlackCat-Release-${{ github.sha }}
          path: |
            bin/Release/LuckierBlackCat.dll
            bin/Release/LuckierBlackCat.Core.dll
            bin/Release/LuckierBlackCat.Patching.dll
            bin/Release/package.xml
            bin/Release/preview.jpg
            bin/Release/*.md
            bin/Release/LICENSE*
          if-no-files-found: error
          retention-days: 30
